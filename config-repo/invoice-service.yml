server:
  port: 8083

spring:
  datasource:
    url: jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=chinook_invoice;encrypt=false;trustServerCertificate=true
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:123456}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true

application:
  services:
    customer-service:
      url: ${CUSTOMER_SERVICE_URL:http://localhost:8082}
    catalog-service:
      url: ${CATALOG_SERVICE_URL:http://localhost:8081}
    payment-service:
      url: ${PAYMENT_SERVICE_URL:http://localhost:8084}
    library-service:
      url: ${LIBRARY_SERVICE_URL:http://localhost:8085}
