server:
  port: 8080

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    compatibility-verifier:
      enabled: false
    gateway:
      discovery:
        locator:
          enabled: false
          lower-case-service-id: true

      routes:
        # Route 1: CATALOG SERVICE
        - id: catalog-service
          uri: lb://catalog-service
          predicates:
            - Path=/api/catalog/**
          filters:
            - RewritePath=/api/catalog/(?<segment>.*), /api/${segment}
            - name: CircuitBreaker
              args:
                name: catalogServiceCB
                fallbackUri: forward:/fallback/catalog

        # Route 2: CUSTOMER SERVICE
        - id: customer-service
          uri: lb://customer-service
          predicates:
            - Path=/api/customers/**
          filters:
            - RewritePath=/api/customers/(?<segment>.*), /api/${segment}
            - name: CircuitBreaker
              args:
                name: customerServiceCB
                fallbackUri: forward:/fallback/customer

        # Route 3: INVOICE SERVICE
        - id: invoice-service
          uri: lb://invoice-service
          predicates:
            - Path=/api/invoices/**
          filters:
            - RewritePath=/api/invoices/(?<segment>.*), /api/${segment}
            - name: CircuitBreaker
              args:
                name: invoiceServiceCB
                fallbackUri: forward:/fallback/invoice

        # Route 4: PAYMENT SERVICE
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/payments/**
          filters:
            - RewritePath=/api/payments/(?<segment>.*), /api/${segment}
            - name: CircuitBreaker
              args:
                name: paymentServiceCB
                fallbackUri: forward:/fallback/payment

        # Route 5: LIBRARY SERVICE
        - id: library-service
          uri: lb://library-service
          predicates:
            - Path=/api/library/**
          filters:
            - RewritePath=/api/library/(?<segment>.*), /api/${segment}
            - name: CircuitBreaker
              args:
                name: libraryServiceCB
                fallbackUri: forward:/fallback/library

        # =======================================================
        # Swagger OpenAPI Aggregator Routes (lb:// forwarding)
        # =======================================================
        - id: catalog-docs
          uri: lb://catalog-service
          predicates:
            - Path=/v3/api-docs/catalog
          filters:
            - SetPath=/v3/api-docs

        - id: customer-docs
          uri: lb://customer-service
          predicates:
            - Path=/v3/api-docs/customer
          filters:
            - SetPath=/v3/api-docs

        - id: invoice-docs
          uri: lb://invoice-service
          predicates:
            - Path=/v3/api-docs/invoice
          filters:
            - SetPath=/v3/api-docs

        - id: payment-docs
          uri: lb://payment-service
          predicates:
            - Path=/v3/api-docs/payment
          filters:
            - SetPath=/v3/api-docs

        - id: library-docs
          uri: lb://library-service
          predicates:
            - Path=/v3/api-docs/library
          filters:
            - SetPath=/v3/api-docs

      # Global default filters applied to all routes
      default-filters:
        - AddRequestHeader=X-Gateway-Version, 1.0
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 40
            redis-rate-limiter.requestedTokens: 1
            key-resolver: "#{@ipKeyResolver}"

      # Global CORS configuration
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

# =======================================================
# Swagger / OpenAPI UI Central Aggregator
# Dropdown menu trên Gateway xem tài liệu toàn bộ 5 services
# =======================================================
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: 1. Catalog Service (Tracks, Albums, Artists)
        url: /v3/api-docs/catalog
      - name: 2. Customer Service (Customers, Employees)
        url: /v3/api-docs/customer
      - name: 3. Invoice Service (Orders, Billing, Saga)
        url: /v3/api-docs/invoice
      - name: 4. Payment Service (Transactions, Refunds)
        url: /v3/api-docs/payment
      - name: 5. Library Service (Entitlements, Playlists)
        url: /v3/api-docs/library
