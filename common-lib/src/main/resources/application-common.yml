# =========================================================
# Enterprise Spring Boot Shared Configuration (MSS Common Lib)
# Inherited by all microservices via:
# spring.config.import: "classpath:application-common.yml"
# =========================================================

spring:
  config:
    import: "optional:configserver:http://${CONFIG_SERVER_HOST:localhost}:${CONFIG_SERVER_PORT:8888}/"
  # -------------------------------------------------------
  # Cấu hình DataSource & Hikari Connection Pool chuẩn Enterprise
  # -------------------------------------------------------
  datasource:
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:123456}
    hikari:
      pool-name: ${spring.application.name:mss}-hikari-pool
      maximum-pool-size: 15
      minimum-idle: 3
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
      leak-detection-threshold: 30000

  # -------------------------------------------------------
  # Cấu hình Spring Data JPA / Hibernate
  # -------------------------------------------------------
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

  # -------------------------------------------------------
  # Cấu hình Database Migration tự động với Flyway
  # -------------------------------------------------------
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

# ---------------------------------------------------------
# Server Graceful Shutdown (Chờ hoàn tất request khi dừng container)
# ---------------------------------------------------------
server:
  shutdown: graceful

# ---------------------------------------------------------
# Cấu hình Giám sát Actuator, Healthcheck, Probes
# ---------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

# ---------------------------------------------------------
# Cấu hình Swagger / OpenAPI Documentation
# ---------------------------------------------------------
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# ---------------------------------------------------------
# Logging chuẩn
# ---------------------------------------------------------
logging:
  level:
    root: INFO
    vn.edu.fpt.mss: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

# ---------------------------------------------------------
# Eureka Client Configuration
# Tất cả microservices kế thừa config này và tự đăng ký vào Eureka.
# spring.application.name của mỗi service được dùng làm tên instance.
# ---------------------------------------------------------
eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
    # Lấy registry để gọi service khác qua tên (load balancing)
    fetch-registry: true
    register-with-eureka: true
  instance:
    # Dùng IP thay vì hostname (quan trọng khi chạy Docker)
    prefer-ip-address: true
    # Healthcheck qua Actuator /health
    health-check-url-path: /actuator/health
    # Interval gửi heartbeat (giây)
    lease-renewal-interval-in-seconds: 15
    # Thời gian timeout nếu mất heartbeat (giây)
    lease-expiration-duration-in-seconds: 45
