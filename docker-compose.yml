# Chinook Microservices Architecture
services:
  # =======================================================
  # Database: Microsoft SQL Server 2022
  # =======================================================
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: chinook-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD:-Password123!}"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    networks:
      - chinook-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $${MSSQL_SA_PASSWORD} -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # =======================================================
  # DB Initializer: Tự động tạo 5 DBs (Catalog, Customer, Invoice, Payment, Library)
  # =======================================================
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: chinook-sqlserver-init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "${DB_PASSWORD:-Password123!}"
    volumes:
      - ./setup-databases.sql:/setup-databases.sql
      - ./init-databases.sh:/init-databases.sh
    entrypoint: ["/bin/bash", "/init-databases.sh"]
    networks:
      - chinook-net
    restart: "no"

  # =======================================================
  # Redis: Cache & Rate Limiting (Port 6379)
  # =======================================================
  redis:
    image: redis:7-alpine
    container_name: chinook-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - chinook-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # =======================================================
  # Zipkin: Distributed Tracing Dashboard (Port 9411)
  # UI: http://localhost:9411
  # =======================================================
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: chinook-zipkin
    restart: unless-stopped
    ports:
      - "9411:9411"
    networks:
      - chinook-net

  # =======================================================
  # Kafka: Event Streaming & Choreography Saga (Port 9092)
  # Chế độ KRaft 1 node (Không cần Zookeeper) - Chuẩn TayJava
  # =======================================================
  kafka:
    image: apache/kafka:latest
    container_name: chinook-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    networks:
      - chinook-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # =======================================================
  # Discovery Server: Eureka Service Registry (Port 8761)
  # Dashboard: http://localhost:8761
  # =======================================================
  discovery-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: discovery-server
    container_name: chinook-discovery-server
    restart: unless-stopped
    ports:
      - "8761:8761"
    networks:
      - chinook-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  # =======================================================
  # Config Server: Centralized Configuration (Port 8888)
  # =======================================================
  config-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: config-server
    container_name: chinook-config-server
    restart: unless-stopped
    depends_on:
      discovery-server:
        condition: service_healthy
    ports:
      - "8888:8888"
    environment:
      - EUREKA_HOST=discovery-server
    volumes:
      - ./config-repo:/config-repo
    networks:
      - chinook-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  # =======================================================
  # API Gateway: Single Entry Point (Port 8080)
  # =======================================================
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: api-gateway
    container_name: chinook-api-gateway
    restart: unless-stopped
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - EUREKA_HOST=discovery-server
      - CONFIG_SERVER_HOST=config-server
      - REDIS_HOST=redis
      - ZIPKIN_HOST=zipkin
    networks:
      - chinook-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 40s

  # =======================================================
  # 1. Catalog Service (Port 8081)
  # =======================================================
  catalog-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: catalog-service
    container_name: chinook-catalog-service
    restart: unless-stopped
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      - DB_HOST=sqlserver
      - DB_PORT=1433
      - DB_USER=sa
      - DB_PASSWORD=${DB_PASSWORD:-Password123!}
      - EUREKA_HOST=discovery-server
      - CONFIG_SERVER_HOST=config-server
      - ZIPKIN_HOST=zipkin
    networks:
      - chinook-net

  # =======================================================
  # 2. Customer Service (Port 8082)
  # =======================================================
  customer-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: customer-service
    container_name: chinook-customer-service
    restart: unless-stopped
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      - DB_HOST=sqlserver
      - DB_PORT=1433
      - DB_USER=sa
      - DB_PASSWORD=${DB_PASSWORD:-Password123!}
      - EUREKA_HOST=discovery-server
      - CONFIG_SERVER_HOST=config-server
      - ZIPKIN_HOST=zipkin
    networks:
      - chinook-net

  # =======================================================
  # 3. Invoice Service (Port 8083)
  # =======================================================
  invoice-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: invoice-service
    container_name: chinook-invoice-service
    restart: unless-stopped
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      - DB_HOST=sqlserver
      - DB_PORT=1433
      - DB_USER=sa
      - DB_PASSWORD=${DB_PASSWORD:-Password123!}
      - CUSTOMER_SERVICE_URL=http://customer-service:8082
      - CATALOG_SERVICE_URL=http://catalog-service:8081
      - PAYMENT_SERVICE_URL=http://payment-service:8084
      - LIBRARY_SERVICE_URL=http://library-service:8085
      - EUREKA_HOST=discovery-server
      - CONFIG_SERVER_HOST=config-server
      - ZIPKIN_HOST=zipkin
    networks:
      - chinook-net

  # =======================================================
  # 4. Payment Service (Port 8084)
  # =======================================================
  payment-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: payment-service
    container_name: chinook-payment-service
    restart: unless-stopped
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    ports:
      - "8084:8084"
    environment:
      - DB_HOST=sqlserver
      - DB_PORT=1433
      - DB_USER=sa
      - DB_PASSWORD=${DB_PASSWORD:-Password123!}
      - EUREKA_HOST=discovery-server
      - CONFIG_SERVER_HOST=config-server
      - ZIPKIN_HOST=zipkin
    networks:
      - chinook-net

  # =======================================================
  # 5. Library Service (Port 8085)
  # =======================================================
  library-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: library-service
    container_name: chinook-library-service
    restart: unless-stopped
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    ports:
      - "8085:8085"
    environment:
      - DB_HOST=sqlserver
      - DB_PORT=1433
      - DB_USER=sa
      - DB_PASSWORD=${DB_PASSWORD:-Password123!}
      - EUREKA_HOST=discovery-server
      - CONFIG_SERVER_HOST=config-server
      - ZIPKIN_HOST=zipkin
    networks:
      - chinook-net

networks:
  chinook-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1

volumes:
  mssql_data:
    driver: local
