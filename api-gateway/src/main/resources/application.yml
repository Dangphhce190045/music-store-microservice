# =======================================================
# API Gateway — Bootstrap Configuration
# Detailed routing, filters, and rate-limiting are loaded
# dynamically from Spring Cloud Config Server (api-gateway.yml)
# =======================================================
server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    compatibility-verifier:
      enabled: false
  config:
    import: "optional:configserver:http://${CONFIG_SERVER_HOST:localhost}:${CONFIG_SERVER_PORT:8888}/"
