# =============================================================================
# GitHub Actions CI Workflow - Music Store Microservices (MSS)
# Chuẩn DevOps hiện đại: Tự động Build, Test và Xác thực Docker Images
# Thay thế Jenkins nặng nề bằng Cloud Native CI/CD hoàn toàn miễn phí
# =============================================================================

name: MSS Microservices CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ---------------------------------------------------------------------------
  # Bước 1: Build & Unit Test toàn bộ Microservices bằng Maven & Java 21
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build & Test (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Run Unit Tests
        run: mvn test

  # ---------------------------------------------------------------------------
  # Bước 2: Kiểm tra Dockerfile & Build Docker Image cho các Service
  # ---------------------------------------------------------------------------
  docker-build-verification:
    name: Verify Docker Image Builds
    needs: build-and-test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - api-gateway
          - catalog-service
          - customer-service
          - invoice-service
          - payment-service
          - library-service

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR for ${{ matrix.service }}
        run: mvn clean package -pl ${{ matrix.service }} -am -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Dry Run)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            APP_NAME=${{ matrix.service }}
          push: false
          tags: mss-${{ matrix.service }}:${{ github.sha }}
